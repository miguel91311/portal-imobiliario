version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: portal-premium-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_secret
      POSTGRES_DB: portal_premium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: portal-premium-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
